<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09070b">
  <meta name="description" content="Septemberlicht — Zwei Jahre an deiner Seite">
  <title>Septemberlicht · Zwei Jahre</title>

  <style>
    :root{
      --bg:#09070b;
      --bg2:#140c12;
      --text:#fff8f6;
      --muted:rgba(255,248,246,.52);
      --muted2:rgba(255,248,246,.32);
      --rose:#ffb4c0;
      --rose2:#ff8ea1;
      --gold:#f1d4a5;
      --glass:rgba(255,255,255,.055);
      --glass2:rgba(255,255,255,.03);
      --border:rgba(255,255,255,.10);
      --ease:cubic-bezier(.16,1,.3,1);
    }

    *{box-sizing:border-box}
    html{width:100%;height:100%;background:var(--bg)}
    body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%,rgba(255,170,188,.12),transparent 38%),
        radial-gradient(ellipse at 10% 90%,rgba(240,192,143,.08),transparent 28%),
        radial-gradient(ellipse at 90% 85%,rgba(200,120,175,.08),transparent 28%),
        linear-gradient(180deg,#08070a 0%,#0c080d 50%,#150b11 100%);
    }

    button{font:inherit}
    canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
    #nebula{z-index:0}
    #stars{z-index:1}
    #petals{z-index:2}
    #hearts{z-index:3}

    .page{
      position:relative;
      z-index:5;
      height:100%;
      width:100%;
      display:flex;
      flex-direction:column;
      padding:
        max(18px,env(safe-area-inset-top))
        16px
        max(16px,env(safe-area-inset-bottom));
    }

    .topbar{
      width:min(1120px,100%);
      margin:0 auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:4px 0 14px;
      flex:0 0 auto;
    }

    .eyebrow{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:10px;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:rgba(255,248,246,.48);
      white-space:nowrap;
    }
    .eyebrow:before{
      content:"";
      width:30px;
      height:1px;
      background:linear-gradient(90deg,var(--rose),transparent);
    }

    .mark{
      color:var(--rose);
      font-size:22px;
      line-height:1;
      animation:heartbeat 3.1s ease-in-out infinite;
      text-shadow:0 0 22px rgba(255,157,181,.42);
    }

    @keyframes heartbeat{
      0%,100%{transform:scale(1);opacity:.72}
      50%{transform:scale(1.13);opacity:1}
    }

    .main{
      width:min(920px,100%);
      min-height:0;
      flex:1;
      margin:0 auto;
      display:flex;
      flex-direction:column;
    }

    .hero{
      text-align:center;
      flex:0 0 auto;
      padding:6px 0 18px;
    }

    .title{
      margin:0;
      font-size:clamp(34px,6.2vw,74px);
      line-height:1.02;
      letter-spacing:-.05em;
      font-weight:520;
      text-wrap:balance;
      text-shadow:0 15px 55px rgba(0,0,0,.35);
    }

    .subtitle{
      margin:11px 0 0;
      font-size:clamp(13px,2vw,17px);
      color:var(--muted);
      font-weight:300;
      letter-spacing:.02em;
    }

    .player{
      flex:0 0 auto;
      display:grid;
      grid-template-columns:170px minmax(0,1fr);
      gap:26px;
      align-items:center;
      padding:18px;
      border:1px solid var(--border);
      border-radius:27px;
      background:
        linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
      backdrop-filter:blur(25px) saturate(125%);
      -webkit-backdrop-filter:blur(25px) saturate(125%);
      box-shadow:
        0 30px 90px rgba(0,0,0,.38),
        inset 0 1px rgba(255,255,255,.055);
    }

    .cover{
      width:170px;
      aspect-ratio:1;
      border-radius:21px;
      overflow:hidden;
      position:relative;
      border:1px solid rgba(255,255,255,.12);
      background:
        radial-gradient(circle at 66% 27%,rgba(255,219,197,.85),transparent 8%),
        radial-gradient(circle at 64% 30%,rgba(255,163,149,.20),transparent 22%),
        linear-gradient(150deg,#33141e 0%,#20101a 43%,#09080d 100%);
      box-shadow:0 22px 50px rgba(0,0,0,.42);
    }

    .cover:before{
      content:"";
      position:absolute;
      inset:22% 8% auto;
      height:44%;
      border-radius:50%;
      background:radial-gradient(circle,rgba(255,208,184,.55),transparent 63%);
      filter:blur(9px);
      opacity:.8;
    }
    .cover:after{
      content:"♡";
      position:absolute;
      right:13px;
      bottom:7px;
      font-size:29px;
      color:rgba(255,222,224,.86);
      text-shadow:0 0 24px rgba(255,145,172,.72);
    }

    .song-label{
      margin-bottom:6px;
      color:var(--muted2);
      font-size:10px;
      letter-spacing:.2em;
      text-transform:uppercase;
    }

    .song-title{
      font-size:clamp(21px,3vw,28px);
      font-weight:500;
      letter-spacing:-.02em;
    }

    .song-sub{
      margin-top:5px;
      color:var(--muted);
      font-size:13px;
    }

    .progress-wrap{
      margin-top:17px;
      user-select:none;
      touch-action:none;
      cursor:pointer;
    }

    .progress{
      position:relative;
      height:20px;
      display:flex;
      align-items:center;
    }

    .progress-bg{
      position:absolute;
      inset-inline:0;
      height:4px;
      border-radius:999px;
      background:rgba(255,255,255,.10);
    }

    .progress-fill{
      position:absolute;
      left:0;
      width:0;
      height:4px;
      border-radius:999px;
      background:linear-gradient(90deg,var(--rose),var(--gold));
      box-shadow:0 0 18px rgba(255,171,189,.48);
    }

    .progress-dot{
      position:absolute;
      left:0;
      width:12px;height:12px;
      transform:translateX(-50%);
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 0 4px rgba(255,179,192,.10),0 4px 14px rgba(0,0,0,.3);
    }

    .times{
      display:flex;
      justify-content:space-between;
      margin-top:4px;
      color:rgba(255,255,255,.40);
      font-size:10px;
      font-variant-numeric:tabular-nums;
    }

    .controls{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:15px;
      margin-top:6px;
    }

    .control{
      width:40px;height:40px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.08);
      color:rgba(255,255,255,.86);
      background:rgba(255,255,255,.04);
      cursor:pointer;
      transition:transform .22s ease,background .22s ease;
      display:grid;
      place-items:center;
    }
    .control:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
    .control:active{transform:scale(.94)}

    .play{
      width:57px;height:57px;
      border-radius:50%;
      border:1px solid rgba(255,180,194,.60);
      color:#fff3f0;
      background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.055));
      box-shadow:
        0 0 0 6px rgba(255,180,192,.025),
        0 0 34px rgba(255,160,180,.14);
      cursor:pointer;
      display:grid;
      place-items:center;
      transition:transform .25s var(--ease),box-shadow .25s var(--ease);
    }
    .play:hover{
      transform:scale(1.05);
      box-shadow:
        0 0 0 8px rgba(255,180,192,.035),
        0 0 44px rgba(255,160,180,.24);
    }
    .play:active{transform:scale(.95)}

    .hint{
      min-height:15px;
      margin-top:5px;
      text-align:center;
      color:rgba(255,255,255,.27);
      font-size:10px;
    }

    .lyrics-card{
      min-height:0;
      flex:1;
      margin-top:12px;
      border:1px solid rgba(255,255,255,.065);
      border-radius:27px;
      background:rgba(255,255,255,.024);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .lyrics-top{
      flex:0 0 auto;
      display:flex;
      justify-content:space-between;
      padding:12px 17px;
      font-size:9px;
      text-transform:uppercase;
      letter-spacing:.22em;
      color:rgba(255,255,255,.30);
    }

    .lyrics{
      flex:1;
      min-height:0;
      overflow-y:auto;
      overscroll-behavior:contain;
      scrollbar-width:thin;
      scrollbar-color:rgba(255,175,190,.35) transparent;
      padding:90px 18px 58vh;
      mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 87%,transparent 100%);
      -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 87%,transparent 100%);
    }

    .lyrics::-webkit-scrollbar{width:5px}
    .lyrics::-webkit-scrollbar-thumb{
      background:linear-gradient(var(--rose),var(--gold));
      border-radius:999px;
    }

    .line{
      max-width:760px;
      margin:0 auto;
      padding:13px 0;
      text-align:center;
      color:rgba(255,255,255,.32);
      font-size:clamp(17px,2.25vw,24px);
      line-height:1.55;
      font-weight:300;
      opacity:.38;
      transform:translateY(14px) scale(.985);
      filter:blur(.65px);
      transition:
        opacity .58s var(--ease),
        transform .58s var(--ease),
        color .58s ease,
        filter .58s ease,
        text-shadow .58s ease;
      cursor:pointer;
    }

    .line.near{opacity:.58}
    .line.active{
      opacity:1;
      color:#fff1ee;
      transform:translateY(0) scale(1.045);
      filter:blur(0);
      text-shadow:0 0 27px rgba(255,174,190,.22);
    }

    .divider{
      width:62px;
      height:1px;
      margin:11px auto 13px;
      background:linear-gradient(90deg,transparent,rgba(255,184,193,.38),transparent);
    }

    .ending{
      text-align:center;
      padding-top:20px;
      color:rgba(255,255,255,.25);
      font-size:11px;
      letter-spacing:.10em;
    }

    .ending strong{
      display:block;
      margin-top:5px;
      font-family:Georgia,serif;
      font-style:italic;
      font-size:27px;
      font-weight:400;
      color:rgba(255,185,194,.85);
      letter-spacing:0;
    }

    .error{
      margin-top:4px;
      color:#ffb5bd;
      font-size:10px;
      text-align:center;
      min-height:14px;
    }

    .sr-only{
      position:absolute!important;
      width:1px!important;
      height:1px!important;
      padding:0!important;
      margin:-1px!important;
      overflow:hidden!important;
      clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;
      border:0!important;
    }

    @media (max-width:760px){
      .page{
        padding-left:9px;
        padding-right:9px;
      }
      .topbar{padding-bottom:10px}
      .eyebrow{
        font-size:8.5px;
        letter-spacing:.20em;
        gap:8px;
      }
      .eyebrow:before{width:22px}
      .hero{padding-bottom:10px}
      .title{font-size:clamp(30px,9vw,44px)}
      .subtitle{font-size:12px}
      .player{
        grid-template-columns:1fr;
        gap:12px;
        padding:13px;
        border-radius:22px;
      }
      .cover{
        width:min(160px,47vw);
        margin:0 auto;
      }
      .song-info{text-align:center}
      .song-label{font-size:9px}
      .song-title{font-size:20px}
      .song-sub{font-size:12px}
      .lyrics-card{border-radius:22px;margin-top:8px}
      .lyrics-top{padding:10px 13px}
      .lyrics{
        padding:85px 10px 55vh;
      }
      .line{
        font-size:16px;
        padding:13px 4px;
      }
      .control{width:37px;height:37px}
      .play{width:53px;height:53px}
    }

    @media (max-height:700px) and (min-width:761px){
      .hero{padding-bottom:10px}
      .player{padding:13px}
      .cover{width:140px}
      .lyrics{padding-top:70px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.001ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
        transition-duration:.001ms!important;
      }
      canvas{display:none}
    }
  </style>
</head>

<body>
  <canvas id="nebula"></canvas>
  <canvas id="stars"></canvas>
  <canvas id="petals"></canvas>
  <canvas id="hearts"></canvas>

  <div class="page">
    <header class="topbar">
      <div class="eyebrow">Septemberlicht · Zwei Jahre</div>
      <div class="mark" aria-hidden="true">♡</div>
    </header>

    <main class="main">
      <section class="hero">
        <h1 class="title">Zwei Jahre an deiner Seite</h1>
        <p class="subtitle">Spätes Septemberlicht</p>
      </section>

      <section class="player" aria-label="Musikplayer">
        <div class="cover" aria-label="Cover"></div>

        <div>
          <div class="song-label">Unser Song</div>
          <div class="song-title">Septemberlicht</div>
          <div class="song-sub">Für zwei Jahre. Für immer wir.</div>

          <div class="progress-wrap" id="progressWrap">
            <div class="progress" aria-hidden="true">
              <div class="progress-bg"></div>
              <div class="progress-fill" id="progressFill"></div>
              <div class="progress-dot" id="progressDot"></div>
            </div>
            <div class="times">
              <span id="currentTime">0:00</span>
              <span id="totalTime">0:00</span>
            </div>
          </div>

          <div class="controls">
            <button class="control" id="back" type="button" aria-label="10 Sekunden zurück">↶</button>

            <button class="play" id="play" type="button" aria-label="Song abspielen">
              <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5v14l11-7z"></path>
              </svg>
              <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none">
                <path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
              </svg>
            </button>

            <button class="control" id="forward" type="button" aria-label="10 Sekunden vor">↷</button>
          </div>

          <div class="hint" id="hint"></div>
          <div class="error" id="error"></div>
        </div>
      </section>

      <section class="lyrics-card">
        <div class="lyrics-top">
          <span>Lyrics</span>
          <span>Live Sync</span>
        </div>

        <div class="lyrics" id="lyrics" aria-label="Songtext"></div>
      </section>
    </main>
  </div>

  <!--
    =========================================================
    MP3 EINTRAGEN
    =========================================================
    Lege die Datei als "song.mp3" direkt neben diese index.html.
    Dann funktioniert der Standardwert automatisch.

    Beispiel für eine Unterordner-Datei:
    audio/song.mp3

    Beispiel für eine absolute URL:
    https://DEINNAME.github.io/Septemberlicht/song.mp3
  -->
  <audio id="audio" preload="metadata">
    <source id="audioSource" src="song.mp3" type="audio/mpeg">
  </audio>

  <script>
    /* =====================================================
       1) AUDIO
       ===================================================== */
    const AUDIO_URL = "song.mp3";

    /*
      2) LYRICS / ZEITMARKEN

      "time" = Sekunden, bei denen die Zeile beginnt.
      Die vorhandenen alten Startpunkte wurden übernommen.
      Die dazwischenliegenden Werte sind vorläufig und können
      später exakt angepasst werden.
    */
    const LYRICS = [
      { time: 5,   text: "Zusammen auf dem Dach, spätes Septemberlicht" },
      { time: 12,  text: "Zwei Jahre an deiner Seite, mehr brauche ich nicht" },
      { time: 19,  text: "Der Wind weht leise, du schaust mich an" },
      { time: 26,  text: "Und ich denke zurück, wie alles begann:" },

      { time: 33,  text: "'Cause we fell in love in September" },
      { time: 38,  text: "On the twenty-first day" },
      { time: 43,  text: "Looking up at the stars" },
      { time: 48,  text: "Just the way that I like it" },

      { time: 53,  text: "моя любимая, mein ganzes Glück" },
      { time: 59,  text: "Ich schau nur nach vorn, nie wieder zurück" },
      { time: 66,  text: "Du bist meine Welt, mein Lieblingsort" },
      { time: 73,  text: "Mit dir bin ich Zuhause, genau hier und sofort" },

      { time: 82,  text: "Warmes Licht am Abend, der Herbst fängt an" },
      { time: 89,  text: "Bin so stolz, dass ich dich meine Freundin nennen kann" },
      { time: 97,  text: "Zwei Jahre vergangen, fühlt sich immer noch neu an" },
      { time: 105, text: "Der beste Weg, den man zusammen gehen kann" },

      { time: 114, text: "'Cause we fell in love in September" },
      { time: 119, text: "On the twenty-first day" },
      { time: 124, text: "Looking up at the stars" },
      { time: 129, text: "Just the way that I like it" },

      { time: 134, text: "моя любимая, mein ganzes Glück" },
      { time: 140, text: "Ich schau nur nach vorn, nie wieder zurück" },
      { time: 147, text: "Du bist meine Welt, mein Lieblingsort" },
      { time: 154, text: "Mit dir bin ich Zuhause, genau hier und sofort" },

      { time: 164, text: "со́лнышко, du bist mein Licht" },
      { time: 171, text: "Zwei Jahre mit dir – ein Ende gibt es nicht" }
    ];

    const audio = document.getElementById("audio");
    const source = document.getElementById("audioSource");
    const playBtn = document.getElementById("play");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const backBtn = document.getElementById("back");
    const forwardBtn = document.getElementById("forward");
    const progressWrap = document.getElementById("progressWrap");
    const progressFill = document.getElementById("progressFill");
    const progressDot = document.getElementById("progressDot");
    const currentTimeEl = document.getElementById("currentTime");
    const totalTimeEl = document.getElementById("totalTime");
    const lyricsRoot = document.getElementById("lyrics");
    const hint = document.getElementById("hint");
    const errorEl = document.getElementById("error");

    source.src = AUDIO_URL;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function setPlayingUI(isPlaying) {
      playIcon.style.display = isPlaying ? "none" : "block";
      pauseIcon.style.display = isPlaying ? "block" : "none";
      playBtn.setAttribute("aria-label", isPlaying ? "Song pausieren" : "Song abspielen");
    }

    function renderLyrics() {
      lyricsRoot.innerHTML = "";

      LYRICS.forEach((item, index) => {
        const line = document.createElement("div");
        line.className = "line";
        line.dataset.index = index;
        line.textContent = item.text;

        line.addEventListener("click", () => {
          audio.currentTime = item.time;
          updateLyrics(true);
        });

        lyricsRoot.appendChild(line);

        if ([3, 7, 11, 15, 19, 23].includes(index)) {
          const divider = document.createElement("div");
          divider.className = "divider";
          divider.setAttribute("aria-hidden", "true");
          lyricsRoot.appendChild(divider);
        }
      });

      const end = document.createElement("div");
      end.className = "ending";
      end.innerHTML = `Genau hier und sofort<strong>Für immer wir ♡</strong>`;
      lyricsRoot.appendChild(end);
    }

    let lastActiveIndex = -1;

    function getActiveIndex(time) {
      let active = -1;
      for (let i = 0; i < LYRICS.length; i++) {
        if (time >= LYRICS[i].time) active = i;
        else break;
      }
      return active;
    }

    function updateLyrics(forceScroll = false) {
      const activeIndex = getActiveIndex(audio.currentTime);
      const nodes = lyricsRoot.querySelectorAll(".line");

      nodes.forEach((node, index) => {
        node.classList.toggle("active", index === activeIndex);
        node.classList.toggle("near", Math.abs(index - activeIndex) === 1);
      });

      if (activeIndex >= 0 && (activeIndex !== lastActiveIndex || forceScroll)) {
        const activeNode = lyricsRoot.querySelector(
          `.line[data-index="${activeIndex}"]`
        );
        if (activeNode) {
          activeNode.scrollIntoView({
            behavior: forceScroll ? "smooth" : "smooth",
            block: "center"
          });
        }
        lastActiveIndex = activeIndex;
      }
    }

    function updateProgress() {
      const duration = audio.duration;
      const current = audio.currentTime || 0;

      currentTimeEl.textContent = formatTime(current);
      totalTimeEl.textContent = formatTime(duration);

      if (!Number.isFinite(duration) || duration <= 0) return;

      const percent = Math.max(0, Math.min(100, (current / duration) * 100));
      progressFill.style.width = `${percent}%`;
      progressDot.style.left = `${percent}%`;
      updateLyrics();
    }

    async function playAudio() {
      errorEl.textContent = "";

      try {
        await audio.play();
      } catch (error) {
        errorEl.textContent =
          "Die MP3 konnte nicht geladen werden. Prüfe, ob song.mp3 neben index.html liegt.";
        console.error(error);
      }
    }

    playBtn.addEventListener("click", () => {
      if (audio.paused) playAudio();
      else audio.pause();
    });

    audio.addEventListener("play", () => {
      setPlayingUI(true);
      hint.textContent = "";
    });

    audio.addEventListener("pause", () => {
      setPlayingUI(false);
    });

    audio.addEventListener("loadedmetadata", () => {
      errorEl.textContent = "";
      totalTimeEl.textContent = formatTime(audio.duration);
      updateProgress();
    });

    audio.addEventListener("timeupdate", updateProgress);
    audio.addEventListener("durationchange", updateProgress);

    audio.addEventListener("error", () => {
      errorEl.textContent =
        "Audio nicht gefunden. Dateiname und Groß-/Kleinschreibung prüfen: song.mp3";
    });

    audio.addEventListener("ended", () => {
      setPlayingUI(false);
      audio.currentTime = 0;
      lastActiveIndex = -1;
      lyricsRoot.scrollTo({ top: 0, behavior: "smooth" });
      updateProgress();
    });

    backBtn.addEventListener("click", () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    forwardBtn.addEventListener("click", () => {
      audio.currentTime = Math.min(
        Number.isFinite(audio.duration) ? audio.duration : Infinity,
        audio.currentTime + 10
      );
    });

    function seekFromClientX(clientX) {
      if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;

      const rect = progressWrap.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      audio.currentTime = ratio * audio.duration;
      updateProgress();
    }

    progressWrap.addEventListener("pointerdown", (event) => {
      seekFromClientX(event.clientX);
      progressWrap.setPointerCapture?.(event.pointerId);
    });

    progressWrap.addEventListener("pointermove", (event) => {
      if (event.buttons) seekFromClientX(event.clientX);
    });

    renderLyrics();
    setPlayingUI(false);

    /* =====================================================
       ROMANTISCHER HINTERGRUND
       ===================================================== */

    const nebula = document.getElementById("nebula");
    const stars = document.getElementById("stars");
    const petals = document.getElementById("petals");
    const hearts = document.getElementById("hearts");

    const nctx = nebula.getContext("2d");
    const sctx = stars.getContext("2d");
    const pctx = petals.getContext("2d");
    const hctx = hearts.getContext("2d");

    let W = window.innerWidth;
    let H = window.innerHeight;
    let DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

    let starData = [];
    let petalData = [];
    let heartData = [];
    let glowData = [];

    function resizeCanvases() {
      W = window.innerWidth;
      H = window.innerHeight;
      DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

      [nebula, stars, petals, hearts].forEach(canvas => {
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = `${W}px`;
        canvas.style.height = `${H}px`;
      });

      [nctx, sctx, pctx, hctx].forEach(ctx => {
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      });

      createAmbientObjects();
    }

    function random(a, b) {
      return a + Math.random() * (b - a);
    }

    function createAmbientObjects() {
      starData = Array.from(
        { length: Math.min(120, Math.floor(W / 7)) },
        () => ({
          x: random(0, W),
          y: random(0, H),
          r: random(.35, 1.5),
          a: random(.16, .72),
          speed: random(.03, .18),
          phase: random(0, Math.PI * 2)
        })
      );

      petalData = Array.from(
        { length: Math.min(22, Math.floor(W / 48)) },
        () => ({
          x: random(0, W),
          y: random(-H, H),
          scale: random(.65, 1.7),
          speed: random(.10, .35),
          rotation: random(0, Math.PI * 2),
          spin: random(-.012, .012),
          sway: random(0, Math.PI * 2),
          alpha: random(.12, .42)
        })
      );

      glowData = Array.from({ length: 7 }, (_, i) => ({
        x: random(-150, W + 150),
        y: random(-150, H + 150),
        r: random(120, 260),
        dx: random(-.035, .035),
        dy: random(-.025, .025),
        type: i % 2 === 0 ? "rose" : "gold"
      }));

      heartData = [];
    }

    function drawHeart(ctx, x, y, size, alpha, rotation) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = "#ffb5c1";
      ctx.lineWidth = 1.2;
      ctx.shadowBlur = 15;
      ctx.shadowColor = "rgba(255,150,175,.75)";

      ctx.beginPath();
      ctx.moveTo(0, size * .30);
      ctx.bezierCurveTo(-size*.62, -size*.02, -size*.48, -size*.60, 0, -size*.30);
      ctx.bezierCurveTo(size*.48, -size*.60, size*.62, -size*.02, 0, size*.30);
      ctx.stroke();

      ctx.restore();
    }

    function drawFrame(t) {
      nctx.clearRect(0, 0, W, H);
      sctx.clearRect(0, 0, W, H);
      pctx.clearRect(0, 0, W, H);
      hctx.clearRect(0, 0, W, H);

      glowData.forEach(g => {
        g.x += g.dx;
        g.y += g.dy;

        if (g.x < -g.r) g.x = W + g.r;
        if (g.x > W + g.r) g.x = -g.r;
        if (g.y < -g.r) g.y = H + g.r;
        if (g.y > H + g.r) g.y = -g.r;

        const grad = nctx.createRadialGradient(
          g.x, g.y, 0, g.x, g.y, g.r
        );

        grad.addColorStop(
          0,
          g.type === "rose"
            ? "rgba(255,170,189,.09)"
            : "rgba(240,207,159,.065)"
        );
        grad.addColorStop(1, "rgba(0,0,0,0)");

        nctx.fillStyle = grad;
        nctx.beginPath();
        nctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
        nctx.fill();
      });

      starData.forEach(s => {
        s.y -= s.speed;
        if (s.y < -8) s.y = H + 8;

        const twinkle =
          .58 + Math.sin(t / 950 + s.phase) * .30;

        sctx.fillStyle =
          `rgba(255,225,220,${s.a * twinkle})`;

        sctx.beginPath();
        sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        sctx.fill();
      });

      petalData.forEach(p => {
        p.y += p.speed;
        p.x += Math.sin(t / 1000 + p.sway) * .18;
        p.rotation += p.spin;

        if (p.y > H + 30) {
          p.y = -30;
          p.x = random(0, W);
        }

        pctx.save();
        pctx.translate(p.x, p.y);
        pctx.rotate(p.rotation);
        pctx.globalAlpha = p.alpha;
        pctx.fillStyle = "#ff9faf";

        pctx.beginPath();
        pctx.moveTo(0, -8 * p.scale);
        pctx.bezierCurveTo(
          7 * p.scale, -4 * p.scale,
          7 * p.scale, 5 * p.scale,
          0, 9 * p.scale
        );
        pctx.bezierCurveTo(
          -7 * p.scale, 5 * p.scale,
          -7 * p.scale, -4 * p.scale,
          0, -8 * p.scale
        );
        pctx.fill();
        pctx.restore();
      });

      if (!audio.paused && Math.random() < 0.016) {
        heartData.push({
          x: random(W * .18, W * .82),
          y: H + 20,
          size: random(5, 11),
          speed: random(.22, .48),
          alpha: random(.22, .48),
          rotation: random(-.2, .2)
        });
      }

      heartData = heartData.filter(h => h.y > -40);

      heartData.forEach(h => {
        h.y -= h.speed;
        h.x += Math.sin(t / 850 + h.y * .01) * .10;
        h.alpha *= .9985;

        drawHeart(
          hctx,
          h.x,
          h.y,
          h.size,
          h.alpha,
          h.rotation
        );
      });

      requestAnimationFrame(drawFrame);
    }

    window.addEventListener("resize", resizeCanvases);
    resizeCanvases();
    requestAnimationFrame(drawFrame);
  </script>
</body>
</html>
