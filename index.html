<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08070b">
  <meta name="description" content="Ты лучше всех, ты просто чудо!">
  <title>Ты лучше всех, ты просто чудо! · Septemberlicht</title>

  <style>
    :root {
      --bg: #08070b;
      --bg2: #160b12;

      --text: #fff8f6;
      --muted: rgba(255, 248, 246, .50);
      --muted-soft: rgba(255, 248, 246, .30);

      --rose: #ffb4c0;
      --rose-bright: #ff8fa4;
      --gold: #f0d19e;

      --glass: rgba(255,255,255,.055);
      --border: rgba(255,255,255,.09);

      --ease: cubic-bezier(.16,1,.3,1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(255, 171, 188, .12),
          transparent 38%
        ),

        radial-gradient(
          ellipse at 10% 90%,
          rgba(240, 190, 140, .08),
          transparent 30%
        ),

        radial-gradient(
          ellipse at 90% 85%,
          rgba(199, 120, 173, .08),
          transparent 30%
        ),

        linear-gradient(
          180deg,
          #08070a 0%,
          #0c080e 52%,
          #160b12 100%
        );
    }

    button {
      font: inherit;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #nebula {
      z-index: 0;
    }

    #stars {
      z-index: 1;
    }

    #petals {
      z-index: 2;
    }

    #hearts {
      z-index: 3;
    }

    /* =========================================
       SEITE
    ========================================== */

    .page {
      position: relative;
      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(16px, env(safe-area-inset-bottom));
    }

    /* =========================================
       HEADER
    ========================================== */

    .topbar {
      width: min(1120px, 100%);
      margin: 0 auto;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 4px 0 14px;

      flex: 0 0 auto;
    }

    .eyebrow {
      display: flex;
      align-items: center;

      gap: 10px;

      color: rgba(255, 248, 246, .46);

      font-size: 10px;
      letter-spacing: .28em;

      text-transform: uppercase;

      white-space: nowrap;
    }

    .eyebrow::before {
      content: "";

      width: 30px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          var(--rose),
          transparent
        );
    }

    .mark {
      color: var(--rose);

      font-size: 22px;

      line-height: 1;

      animation:
        heartbeat 3s ease-in-out infinite;

      text-shadow:
        0 0 22px rgba(255, 157, 181, .45);
    }

    @keyframes heartbeat {

      0%,
      100% {
        transform: scale(1);
        opacity: .72;
      }

      50% {
        transform: scale(1.13);
        opacity: 1;
      }
    }

    /* =========================================
       MAIN
    ========================================== */

    .main {
      width: min(920px, 100%);

      min-height: 0;

      flex: 1;

      margin: 0 auto;

      display: flex;
      flex-direction: column;
    }

    /* =========================================
       TITEL
    ========================================== */

    .hero {
      flex: 0 0 auto;

      text-align: center;

      padding:
        6px 0 18px;
    }

    .title {
      margin: 0;

      font-size:
        clamp(
          32px,
          6vw,
          70px
        );

      line-height: 1.04;

      letter-spacing: -.045em;

      font-weight: 520;

      text-shadow:
        0 15px 55px rgba(0,0,0,.35);
    }

    .subtitle {
      margin: 11px 0 0;

      color: var(--muted);

      font-size:
        clamp(
          13px,
          2vw,
          17px
        );

      font-weight: 300;
    }

    /* =========================================
       PLAYER
    ========================================== */

    .player {
      flex: 0 0 auto;

      display: grid;

      grid-template-columns:
        170px
        minmax(0, 1fr);

      gap: 26px;

      align-items: center;

      padding: 18px;

      border:
        1px solid var(--border);

      border-radius: 27px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.025)
        );

      backdrop-filter:
        blur(25px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(25px)
        saturate(125%);

      box-shadow:
        0 30px 90px rgba(0,0,0,.40),
        inset 0 1px rgba(255,255,255,.06);
    }

    /* =========================================
       COVER
    ========================================== */

    .cover {
      width: 170px;

      aspect-ratio: 1;

      position: relative;

      overflow: hidden;

      border-radius: 21px;

      border:
        1px solid rgba(255,255,255,.12);

      background:

        radial-gradient(
          circle at 67% 27%,
          rgba(255,220,199,.85),
          transparent 8%
        ),

        radial-gradient(
          circle at 64% 32%,
          rgba(255,160,180,.20),
          transparent 22%
        ),

        linear-gradient(
          150deg,
          #35141f 0%,
          #21101a 45%,
          #09080d 100%
        );

      box-shadow:
        0 22px 50px rgba(0,0,0,.43);
    }

    .cover::before {

      content: "";

      position: absolute;

      inset: 20% 7% auto;

      height: 44%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,210,185,.55),
          transparent 65%
        );

      filter:
        blur(9px);

      opacity: .82;
    }

    .cover::after {

      content: "♡";

      position: absolute;

      right: 13px;
      bottom: 7px;

      font-size: 29px;

      color:
        rgba(255,224,226,.86);

      text-shadow:
        0 0 24px rgba(255,145,172,.72);
    }

    /* =========================================
       SONG INFORMATION
    ========================================== */

    .song-label {

      margin-bottom: 6px;

      color:
        var(--muted-soft);

      font-size: 10px;

      letter-spacing: .2em;

      text-transform: uppercase;
    }

    .song-title {

      font-size:
        clamp(
          21px,
          3vw,
          28px
        );

      font-weight: 500;

      letter-spacing: -.02em;
    }

    .song-sub {

      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;
    }

    /* =========================================
       FORTSCHRITT
    ========================================== */

    .progress-wrap {

      position: relative;

      margin-top: 17px;

      user-select: none;

      touch-action: none;

      cursor: pointer;
    }

    .progress {

      position: relative;

      height: 20px;

      display: flex;

      align-items: center;
    }

    .progress-bg {

      position: absolute;

      left: 0;
      right: 0;

      height: 4px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.10);
    }

    .progress-fill {

      position: absolute;

      left: 0;

      width: 0%;

      height: 4px;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          var(--rose),
          var(--gold)
        );

      box-shadow:
        0 0 18px rgba(255,171,189,.48);
    }

    .progress-dot {

      position: absolute;

      left: 0;

      width: 12px;
      height: 12px;

      transform:
        translateX(-50%);

      border-radius: 50%;

      background: #fff;

      box-shadow:
        0 0 0 4px
        rgba(255,179,192,.10),

        0 4px 14px
        rgba(0,0,0,.30);
    }

    .times {

      display: flex;

      justify-content: space-between;

      margin-top: 4px;

      color:
        rgba(255,255,255,.40);

      font-size: 10px;

      font-variant-numeric:
        tabular-nums;
    }

    /* =========================================
       CONTROLS
    ========================================== */

    .controls {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 15px;

      margin-top: 7px;
    }

    .control {

      width: 40px;
      height: 40px;

      display: grid;

      place-items: center;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,.08);

      color:
        rgba(255,255,255,.86);

      background:
        rgba(255,255,255,.04);

      cursor: pointer;

      transition:
        transform .22s ease,
        background .22s ease;
    }

    .control:hover {

      background:
        rgba(255,255,255,.09);

      transform:
        translateY(-2px);
    }

    .control:active {

      transform:
        scale(.94);
    }

    .play {

      width: 57px;
      height: 57px;

      display: grid;

      place-items: center;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,180,194,.60);

      color:
        #fff3f0;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.13),
          rgba(255,255,255,.055)
        );

      box-shadow:
        0 0 0 6px rgba(255,180,192,.025),
        0 0 34px rgba(255,160,180,.14);

      cursor: pointer;

      transition:
        transform .25s var(--ease),
        box-shadow .25s var(--ease);
    }

    .play:hover {

      transform:
        scale(1.06);

      box-shadow:
        0 0 0 8px
        rgba(255,180,192,.035),

        0 0 44px
        rgba(255,160,180,.25);
    }

    .play:active {

      transform:
        scale(.95);
    }

    /* =========================================
       LAUTSTÄRKE
    ========================================== */

    .volume-area {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      margin-top: 8px;
    }

    .volume-icon {

      width: 16px;

      flex: 0 0 auto;

      color:
        rgba(255,255,255,.50);

      display: grid;

      place-items: center;
    }

    .volume-slider {

      width:
        min(
          150px,
          42%
        );

      height: 22px;

      appearance: none;

      -webkit-appearance: none;

      background: transparent;

      cursor: pointer;
    }

    .volume-slider::-webkit-slider-runnable-track {

      height: 4px;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          var(--rose),
          var(--gold)
        );
    }

    .volume-slider::-moz-range-track {

      height: 4px;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          var(--rose),
          var(--gold)
        );
    }

    .volume-slider::-webkit-slider-thumb {

      appearance: none;

      -webkit-appearance: none;

      width: 13px;
      height: 13px;

      margin-top: -4.5px;

      border: 0;

      border-radius: 50%;

      background: #fff;

      box-shadow:
        0 0 0 4px
        rgba(255,180,194,.10),

        0 3px 12px
        rgba(0,0,0,.35);
    }

    .volume-slider::-moz-range-thumb {

      width: 13px;
      height: 13px;

      border: 0;

      border-radius: 50%;

      background: #fff;

      box-shadow:
        0 0 0 4px
        rgba(255,180,194,.10),

        0 3px 12px
        rgba(0,0,0,.35);
    }

    .volume-value {

      width: 30px;

      color:
        rgba(255,255,255,.36);

      font-size: 9px;

      font-variant-numeric:
        tabular-nums;

      text-align: right;
    }

    .hint {

      min-height: 13px;

      margin-top: 4px;

      color:
        rgba(255,255,255,.25);

      font-size: 9px;

      text-align: center;
    }

    .error {

      min-height: 14px;

      text-align: center;

      color:
        #ffb6c0;

      font-size: 10px;
    }

    /* =========================================
       LYRICS CARD
    ========================================== */

    .lyrics-card {

      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;

      overflow: hidden;

      margin-top: 12px;

      border:
        1px solid
        rgba(255,255,255,.065);

      border-radius: 27px;

      background:
        rgba(255,255,255,.024);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);
    }

    .lyrics-top {

      flex: 0 0 auto;

      display: flex;

      justify-content: space-between;

      padding:
        12px 17px;

      color:
        rgba(255,255,255,.30);

      font-size: 9px;

      letter-spacing: .22em;

      text-transform: uppercase;
    }

    /* =========================================
       LYRICS
    ========================================== */

    .lyrics {

      flex: 1;

      min-height: 0;

      overflow-y: auto;

      overscroll-behavior: contain;

      scrollbar-width: thin;

      scrollbar-color:
        rgba(255,175,190,.35)
        transparent;

      padding:
        65px
        18px
        52vh;

      mask-image:
        linear-gradient(
          to bottom,
          transparent 0%,
          #000 12%,
          #000 86%,
          transparent 100%
        );

      -webkit-mask-image:
        linear-gradient(
          to bottom,
          transparent 0%,
          #000 12%,
          #000 86%,
          transparent 100%
        );
    }

    .lyrics::-webkit-scrollbar {
      width: 5px;
    }

    .lyrics::-webkit-scrollbar-thumb {

      background:
        linear-gradient(
          var(--rose),
          var(--gold)
        );

      border-radius:
        999px;
    }

    /* =========================================
       LYRICS ZEILEN
    ========================================== */

    .line {

      position: relative;

      max-width: 760px;

      margin: 0 auto;

      padding: 10px 0;

      text-align: center;

      color:
        rgba(255,255,255,.29);

      font-size:
        clamp(
          17px,
          2.25vw,
          24px
        );

      line-height: 1.45;

      font-weight: 300;

      opacity: .34;

      transform:
        translateY(21px)
        scale(.975);

      filter:
        blur(1px);

      transition:
        opacity .40s var(--ease),
        transform .46s var(--ease),
        color .40s ease,
        filter .40s ease,
        text-shadow .40s ease;

      cursor: pointer;
    }

    .line.near {

      opacity: .62;

      transform:
        translateY(6px)
        scale(.995);

      filter:
        blur(.20px);
    }

    .line.active {

      opacity: 1;

      color:
        #fff2ef;

      transform:
        translateY(0)
        scale(1.065);

      filter:
        blur(0);

      text-shadow:
        0 0 14px
        rgba(255,172,190,.25),

        0 0 35px
        rgba(255,172,190,.12);
    }

    .line.active::before {

      content: "";

      position: absolute;

      left: -22px;

      top: 50%;

      width: 5px;
      height: 5px;

      transform:
        translateY(-50%);

      border-radius: 50%;

      background:
        var(--rose);

      box-shadow:
        0 0 14px
        rgba(255,150,175,.90);

      animation:
        lyricDot 1.5s ease-in-out infinite;
    }

    @keyframes lyricDot {

      0%,
      100% {

        transform:
          translateY(-50%)
          scale(.7);

        opacity: .5;
      }

      50% {

        transform:
          translateY(-50%)
          scale(1.25);

        opacity: 1;
      }
    }

    .divider {

      width: 58px;

      height: 1px;

      margin:
        8px auto 11px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,184,193,.38),
          transparent
        );
    }

    .ending {

      text-align: center;

      padding-top: 18px;

      color:
        rgba(255,255,255,.25);

      font-size: 11px;

      letter-spacing: .10em;
    }

    .ending strong {

      display: block;

      margin-top: 6px;

      color:
        rgba(255,185,194,.88);

      font-family:
        Georgia,
        serif;

      font-size: 27px;

      font-style: italic;

      font-weight: 400;

      letter-spacing: 0;
    }

    /* =========================================
       MOBILE
    ========================================== */

    @media (max-width: 760px) {

      .page {

        padding-left: 9px;
        padding-right: 9px;
      }

      .topbar {

        padding-bottom: 9px;
      }

      .eyebrow {

        font-size: 8.5px;

        letter-spacing: .18em;

        gap: 8px;
      }

      .eyebrow::before {
        width: 22px;
      }

      .hero {

        padding-bottom: 8px;
      }

      .title {

        font-size:
          clamp(
            29px,
            8.6vw,
            43px
          );
      }

      .subtitle {
        font-size: 12px;
      }

      .player {

        grid-template-columns: 1fr;

        gap: 11px;

        padding: 13px;

        border-radius: 22px;
      }

      .cover {

        width:
          min(
            155px,
            45vw
          );

        margin:
          0 auto;
      }

      .song-info {

        text-align: center;
      }

      .song-label {
        font-size: 9px;
      }

      .song-title {
        font-size: 20px;
      }

      .song-sub {
        font-size: 12px;
      }

      .progress-wrap {
        margin-top: 15px;
      }

      .controls {
        margin-top: 6px;
      }

      .volume-area {
        margin-top: 6px;
      }

      .volume-slider {
        width:
          min(
            145px,
            50%
          );
      }

      .lyrics-card {

        margin-top: 8px;

        border-radius: 22px;
      }

      .lyrics-top {

        padding:
          10px 13px;
      }

      .lyrics {

        padding:
          55px
          10px
          48vh;
      }

      .line {

        font-size: 16px;

        line-height: 1.42;

        padding:
          9px 4px;
      }

      .line.active {

        transform:
          scale(1.035);
      }

      .line.active::before {

        left: -9px;
      }

      .control {

        width: 37px;
        height: 37px;
      }

      .play {

        width: 53px;
        height: 53px;
      }
    }

    /* =========================================
       KLEINE HANDYS
    ========================================== */

    @media (max-width: 420px) {

      .title {

        font-size:
          28px;
      }

      .cover {

        width:
          138px;
      }

      .player {

        padding:
          11px;
      }

      .lyrics {

        padding-top:
          48px;
      }

      .line {

        font-size:
          15px;
      }

      .volume-slider {
        width: 135px;
      }
    }

    /* =========================================
       WENIGER BEWEGUNG
    ========================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          .001ms !important;

        animation-iteration-count:
          1 !important;

        scroll-behavior:
          auto !important;

        transition-duration:
          .001ms !important;
      }

      canvas {
        display: none;
      }
    }
  </style>
</head>

<body>

<canvas id="nebula"></canvas>
<canvas id="stars"></canvas>
<canvas id="petals"></canvas>
<canvas id="hearts"></canvas>


<div class="page">

  <!-- =========================================
       HEADER
  ========================================== -->

  <header class="topbar">

    <div class="eyebrow">
      Septemberlicht · Zwei Jahre
    </div>

    <div class="mark">
      ♡
    </div>

  </header>


  <main class="main">

    <!-- =======================================
         TITEL
    ======================================== -->

    <section class="hero">

      <h1 class="title">
        Ты лучше всех, ты просто чудо!
      </h1>

      <p class="subtitle">
        Spätes Septemberlicht
      </p>

    </section>


    <!-- =======================================
         PLAYER
    ======================================== -->

    <section class="player">

      <div class="cover"></div>


      <div>

        <div class="song-label">
          Unser Song
        </div>

        <div class="song-title">
          Septemberlicht
        </div>

        <div class="song-sub">
          schon 2 Jahre. Für immer wir.
        </div>


        <!-- FORTSCHRITT -->

        <div
          class="progress-wrap"
          id="progressWrap"
        >

          <div class="progress">

            <div class="progress-bg"></div>

            <div
              class="progress-fill"
              id="progressFill"
            ></div>

            <div
              class="progress-dot"
              id="progressDot"
            ></div>

          </div>


          <div class="times">

            <span id="currentTime">
              0:00
            </span>

            <span id="totalTime">
              0:00
            </span>

          </div>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

          <button
            class="control"
            id="back"
            type="button"
            aria-label="10 Sekunden zurück"
          >
            ↶
          </button>


          <button
            class="play"
            id="play"
            type="button"
            aria-label="Song abspielen"
          >

            <svg
              id="playIcon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
            >

              <path d="M8 5v14l11-7z"/>

            </svg>


            <svg
              id="pauseIcon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
              style="display:none"
            >

              <path
                d="M6 5h4v14H6zm8 0h4v14h-4z"
              />

            </svg>

          </button>


          <button
            class="control"
            id="forward"
            type="button"
            aria-label="10 Sekunden vor"
          >
            ↷
          </button>

        </div>


        <!-- ====================================
             LAUTSTÄRKE
        ===================================== -->

        <div class="volume-area">

          <div
            class="volume-icon"
            id="volumeIcon"
          >

            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >

              <polygon

function formatTime(
  seconds
) {

  if (
    !Number.isFinite(
      seconds
    )
    ||
    seconds < 0
  ) {

    return "0:00";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    Math.floor(
      seconds % 60
    )
    .toString()
    .padStart(
      2,
      "0"
    );


  return (
    minutes +
    ":" +
    secs
  );

}

function getActiveIndex(
  time
) {

  let active =
    -1;


  for (
    let i = 0;
    i < LYRICS.length;
    i++
  ) {

    if (
      time >=
      LYRICS[i].time
    ) {

      active =
        i;

    }

    else {

      break;

    }

  }


  return active;

}


/* =====================================================
   LYRICS AKTUALISIEREN
===================================================== */

function updateLyrics(
  forceScroll = false
) {

  const active =
    getActiveIndex(
      audio.currentTime
    );


  const lines =
    lyricsRoot.querySelectorAll(
      ".line"
    );


  lines.forEach(
    (
      line,
      index
    ) => {

      const distance =
        index -
        active;


      line.classList.toggle(
        "active",
        index === active
      );


      line.classList.toggle(
        "near",
        Math.abs(distance) <= 1
        &&
        index !== active
      );

    }
  );


  /*
   * Automatisch scrollen
   */

  if (
    active >= 0
    &&
    (
      active !== lastActive
      ||
      forceScroll
    )
  ) {

    const activeLine =
      lyricsRoot.querySelector(
        `.line[data-index="${active}"]`
      );


    if (
      activeLine
    ) {

      activeLine.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }


    lastActive =
      active;

  }

}

function updateProgress() {

  const duration =

  const current =
    audio.currentTime ||

  currentTime.textContent =
    formatTime(
      current

  if (
    !Number.isFinite(

    duration <= 0

    return;

  const percentage =
    Math.max(
      0,
      Math.min(
        100,
        current /
        duration *
        100
      )
    );


  progressFill.style.width =
    percentage +
    "%";


  progressDot.style.left =
    percentage +
    "%";


  totalTime.textContent =
    formatTime(
      duration

  updateLyrics();

}


/* =====================================================

function seekFromPointer(
  clientX
) {

  if (
    !Number.isFinite(
      audio.duration
    )
  ) {

    return;

  }


  const rect =
    progressWrap.getBoundingClientRect();


  const ratio =
    Math.max(
      0,
      Math.min(
        1,

        (
          clientX -
          rect.left
        )
        /
        rect.width
      )
    );


  audio.currentTime =
    ratio *
    audio.duration;

}


progressWrap.addEventListener(
  "pointerdown",
  event => {

    seekFromPointer(
      event.clientX
    );


    progressWrap.setPointerCapture?.(
      event.pointerId
    );

  }
);

  "pointermove",
  event => {

    if (

let petalData = [];

/* =====================================================
   CANVAS RESIZE
===================================================== */

function resizeCanvases() {

  width =
    window.innerWidth;

  height =
    window.innerHeight;


  dpr =
    Math.max(
      1,
      Math.min(
        2,
        window.devicePixelRatio || 1

    );

    nebulaCanvas,
    starsCanvas,
    petalsCanvas,
    heartsCanvas

    canvas => {

      canvas.width =
        width *
        dpr;


      canvas.height =
        height *
        dpr;


      canvas.style.width =
        width +
        "px";


      canvas.style.height =
        height +
        "px";

    }
  );


  [
    nebula,
    stars,
    petals,
    hearts
  ].forEach(
    context => {

      context.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

    }
  );


  createAmbientObjects();

}


/* =====================================================
   RANDOM
===================================================== */

function random(
  min,
  max
) {

  return (
    min +
    Math.random() *
    (max - min)
  );

}


/* =====================================================
   AMBIENT OBJEKTE
===================================================== */

function createAmbientObjects() {

  /*
   * Sterne
   */

            120,
            Math.floor(

            height

        r:

            .35,
            1.5
          ),

        alpha:
          random(
            .15,
            .70
          ),

        speed:
          random(
            .03,
            .18
          ),

        phase:
          random(
            0,
            Math.PI * 2
          )

      })
    );


  /*
   * Blüten
   */

  petalData =
    Array.from(
      {
        length:
          Math.min(
            24,
            Math.floor(
              width / 45
            )
          )
      },

      () => ({

        x:
          random(
            0,
            width
          ),

        y:
          random(
            -height,
            height
          ),

        scale:
          random(
            .65,
            1.7
          ),

        speed:
          random(
            .10,
            .36
          ),

        rotation:
          random(
            0,
            Math.PI * 2
          ),

        spin:
          random(
            -.012,
            .012
          ),

        sway:
          random(
            0,
            Math.PI * 2
          ),

        alpha:
          random(
            .12,
            .42
          )

      })
    );


  /*
   * Licht
   */

  glowData =
    Array.from(
      {
        length: 8
      },

      (
        _,
        index
      ) => ({

        x:
          random(
            -150,
            width + 150
          ),

        y:
          random(
            -150,
            height + 150
          ),

        radius:
          random(
            120,
            280
          ),

        dx:
          random(
            -.035,
            .035
          ),

        dy:
          random(
            -.025,
            .025
          ),

        type:
          index % 2 === 0
            ? "rose"
            : "gold"

      })
    );


  heartData = [];

}


/* =====================================================
   HERZ ZEICHNEN
===================================================== */

function drawHeart(
  context,
  x,
  y,
  size,
  alpha,
  rotation
) {

  context.save();


  context.translate(
    x,
    y
  );


  context.rotate(
    rotation
  );


  context.globalAlpha =
    alpha;


  context.strokeStyle =
    "#ffb5c1";


  context.lineWidth =
    1.2;


  context.shadowBlur =
    15;


  context.shadowColor =
    "rgba(255,150,175,.75)";


  context.beginPath();


  context.moveTo(
    0,
    size * .30
  );


  context.bezierCurveTo(
    -size * .62,
    -size * .02,
    -size * .48,
    -size * .60,
    0,
    -size * .30
  );


  context.bezierCurveTo(
    size * .48,
    -size * .60,
    size * .62,
    -size * .02,
    0,
    size * .30
  );


  context.stroke();


  context.restore();

}


/* =====================================================
   HINTERGRUND ANIMATION
===================================================== */

function animateBackground(
  time
) {

  nebula.clearRect(
    0,
    0,
    width,
    height
  );


  stars.clearRect(
    0,
    0,
    width,
    height
  );


  petals.clearRect(
    0,
    0,
    width,
    height
  );


  hearts.clearRect(
    0,
    0,
    width,
    height
  );


  /* -------------------------------------
     LICH T
  ------------------------------------- */

  glowData.forEach(
    glow => {

      glow.x +=
        glow.dx;


      glow.y +=
        glow.dy;


      if (
        glow.x <
        -glow.radius
      ) {

        glow.x =
          width +
          glow.radius;

      }


      if (
        glow.x >
        width +
        glow.radius
      ) {

        glow.x =
          -glow.radius;

      }


      if (
        glow.y <
        -glow.radius
      ) {

        glow.y =
          height +
          glow.radius;

      }


      if (
        glow.y >
        height +
        glow.radius
      ) {

        glow.y =
          -glow.radius;

      }


      const gradient =
        nebula.createRadialGradient(
          glow.x,
          glow.y,
          0,

          glow.x,
          glow.y,
          glow.radius
        );


      gradient.addColorStop(
        0,

        glow.type === "rose"
          ? "rgba(255,170,189,.09)"
          : "rgba(240,207,159,.065)"
      );


      gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
      );


      nebula.fillStyle =
        gradient;


      nebula.beginPath();


      nebula.arc(
        glow.x,
        glow.y,
        glow.radius,
        0,
        Math.PI * 2
      );


      nebula.fill();

    }
  );


  /* -------------------------------------
     STERNE
  ------------------------------------- */

  starData.forEach(
    star => {

      star.y -=
        star.speed;


      if (
        star.y <
        -8
      ) {

        star.y =
          height + 8;

      }


      const twinkle =
        .58 +
        Math.sin(
          time / 850 +
          star.phase
        ) * .30;


      stars.fillStyle =
        `rgba(
          255,
          225,
          220,
          ${star.alpha * twinkle}
        )`;


      stars.beginPath();


      stars.arc(
        star.x,
        star.y,
        star.r,
        0,
        Math.PI * 2
      );


      stars.fill();

    }
  );


  /* -------------------------------------
     BLÜTEN
  ------------------------------------- */

  petalData.forEach(
    petalItem => {

      petalItem.y +=
        petalItem.speed;


      petalItem.x +=
        Math.sin(
          time / 950 +
          petalItem.sway
        ) * .20;


      petalItem.rotation +=
        petalItem.spin;


      if (
        petalItem.y >
        height + 30
      ) {

        petalItem.y =
          -30;


        petalItem.x =
          random(
            0,
            width
          );

      }


      petals.save();


      petals.translate(
        petalItem.x,
        petalItem.y
      );


      petals.rotate(
        petalItem.rotation
      );


      petals.globalAlpha =
        petalItem.alpha;


      petals.fillStyle =
        "#ff9faf";


      petals.beginPath();


      petals.moveTo(
        0,
        -8 *
        petalItem.scale
      );


      petals.bezierCurveTo(
        7 *
        petalItem.scale,

        -4 *
        petalItem.scale,

        7 *
        petalItem.scale,

        5 *
        petalItem.scale,

        0,

        9 *
        petalItem.scale
      );


      petals.bezierCurveTo(
        -7 *
        petalItem.scale,

        5 *
        petalItem.scale,

        -7 *
        petalItem.scale,

        -4 *
        petalItem.scale,

        0,

        -8 *
        petalItem.scale
      );


      petals.fill();


      petals.restore();

    }
  );


  /* -------------------------------------
     HERZEN WÄHREND DES SONGS
  ------------------------------------- */

  if (
    !audio.paused
    &&
    Math.random() < .018
  ) {

    heartData.push({

      x:
        random(
          width * .18,
          width * .82
        ),

      y:
        height + 20,

      size:
        random(
          5,
          11
        ),

      speed:
        random(
          .22,
          .50
        ),

      alpha:
        random(
          .20,
          .48
        ),

      rotation:
        random(
          -.20,
          .20
        )

    });

  }


  heartData =
    heartData.filter(
      item =>
        item.y >
        -40
    );


  heartData.forEach(
    item => {

      item.y -=
        item.speed;


      item.x +=
        Math.sin(
          time / 850 +
          item.y * .01
        ) * .10;


      item.alpha *=
        .9985;


      drawHeart(
        hearts,
        item.x,
        item.y,
        item.size,
        item.alpha,
        item.rotation
      );

    }
  );


  requestAnimationFrame(
    animateBackground
  );

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "resize",
  resizeCanvases
);


resizeCanvases();


requestAnimationFrame(
  animateBackground
);

</script>
