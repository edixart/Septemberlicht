<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#100d12">
  <meta name="description" content="Spätes Septemberlicht – schon 2 Jahre. Für immer wir.">
  <title>Spätes Septemberlicht</title>
  <style>
    :root {
      --bg: #0b090d;
      --bg-soft: #120d13;
      --panel: rgba(29, 22, 30, 0.68);
      --panel-strong: rgba(34, 24, 35, 0.82);
      --line: rgba(255, 255, 255, 0.09);
      --line-strong: rgba(255, 255, 255, 0.14);
      --text: #fbf7fa;
      --text-soft: #d7ccd5;
      --muted: #9b909a;
      --rose: #efaaa8;
      --rose-light: #ffd3d0;
      --amber: #f6d28e;
      --plum: #8b526e;
      --shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(239, 170, 168, 0.10), transparent 31%),
        radial-gradient(circle at 88% 12%, rgba(246, 210, 142, 0.07), transparent 28%),
        radial-gradient(circle at 62% 90%, rgba(139, 82, 110, 0.11), transparent 33%),
        linear-gradient(180deg, #0a080c 0%, #110b12 48%, #0a080d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, [role="slider"]:focus-visible, input:focus-visible {
      outline: 2px solid var(--rose-light);
      outline-offset: 4px;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.055;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      margin-bottom: 34px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.01em;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--text-soft);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.11);
      background: rgba(255,255,255,.045);
      box-shadow: inset 0 1px rgba(255,255,255,.08), 0 8px 26px rgba(0,0,0,.25);
      color: var(--rose-light);
      font-size: 14px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--rose);
      box-shadow: 0 0 18px rgba(239,170,168,.62);
    }

    .hero {
      margin-bottom: 24px;
      padding: 8px 4px 0;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--rose);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 820px;
      margin: 0;
      font-size: clamp(46px, 8vw, 92px);
      line-height: .96;
      letter-spacing: -.055em;
      font-weight: 700;
      text-wrap: balance;
    }

    .hero-subtitle {
      margin: 22px 0 0;
      max-width: 640px;
      color: var(--text-soft);
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.45;
      letter-spacing: -.012em;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(330px, .83fr) minmax(0, 1.17fr);
      gap: 22px;
      align-items: start;
      margin-top: 38px;
    }

    .surface {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(31, 24, 32, .75), rgba(21, 16, 23, .73));
      box-shadow: var(--shadow), inset 0 1px rgba(255,255,255,.045);
      -webkit-backdrop-filter: blur(30px) saturate(120%);
      backdrop-filter: blur(30px) saturate(120%);
    }

    .player-card {
      position: sticky;
      top: 18px;
      border-radius: 34px;
      padding: 18px;
    }

    .player-card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -80px;
      top: -90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239,170,168,.18), rgba(239,170,168,0) 70%);
      pointer-events: none;
    }

    .player-card::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 190px;
      left: -150px;
      bottom: -110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(246,210,142,.11), rgba(246,210,142,0) 72%);
      pointer-events: none;
    }

    .cover {
      position: relative;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 24px;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 215, 204, .30), transparent 20%),
        radial-gradient(circle at 66% 68%, rgba(246, 210, 142, .22), transparent 23%),
        linear-gradient(145deg, #3e2638 0%, #1e131d 48%, #0d0a10 100%);
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: inset 0 1px rgba(255,255,255,.11), 0 24px 60px rgba(0,0,0,.30);
    }

    .cover-halo {
      position: absolute;
      width: 66%;
      height: 66%;
      border-radius: 50%;
      background: conic-gradient(from 210deg, rgba(239,170,168,.35), rgba(246,210,142,.03), rgba(139,82,110,.30), rgba(239,170,168,.35));
      filter: blur(8px);
      opacity: .86;
      transform: scale(.98);
    }

    .cover-disc {
      position: relative;
      width: 57%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 36%, #f7c0bd 0 4%, transparent 4.5%),
        radial-gradient(circle at 63% 67%, #f6d28e 0 3%, transparent 3.5%),
        repeating-radial-gradient(circle, rgba(255,255,255,.11) 0 1px, transparent 1px 7px),
        radial-gradient(circle, #241421 0 20%, #160f17 58%, #0a080d 100%);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 16px 45px rgba(0,0,0,.42), inset 0 0 0 12px rgba(255,255,255,.015);
      transition: transform 900ms var(--ease);
    }

    .is-playing .cover-disc { animation: disc-spin 9s linear infinite; }

    .cover-disc::after {
      content: "♡";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(34px, 6vw, 54px);
      color: rgba(255, 211, 208, .88);
      text-shadow: 0 0 32px rgba(239,170,168,.50);
      transform: translateY(-2px);
    }

    @keyframes disc-spin { to { transform: rotate(360deg); } }

    .song-meta {
      padding: 21px 5px 5px;
    }

    .song-title {
      margin: 0;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -.03em;
    }

    .song-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .player-controls {
      margin-top: 26px;
      padding-top: 19px;
      border-top: 1px solid rgba(255,255,255,.065);
    }

    .progress-wrap {
      padding: 8px 0 0;
    }

    .progress-track {
      position: relative;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
    }

    .progress-track::before {
      content: "";
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,.13);
      box-shadow: inset 0 1px rgba(255,255,255,.035);
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 7px;
      height: 4px;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--rose), var(--amber));
      box-shadow: 0 0 18px rgba(239,170,168,.16);
    }

    .progress-thumb {
      position: absolute;
      top: 3px;
      left: 0;
      width: 12px;
      height: 12px;
      margin-left: -6px;
      border-radius: 50%;
      background: #fff7f6;
      box-shadow: 0 2px 14px rgba(239,170,168,.45);
      transform: scale(.82);
      transition: transform .2s ease;
    }

    .progress-track:hover .progress-thumb,
    .progress-track.dragging .progress-thumb { transform: scale(1); }

    .time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-top: 21px;
    }

    .skip-group {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-self: start;
    }

    .control-button {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 50%;
      background: rgba(255,255,255,.045);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .control-button:hover {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.14);
    }

    .control-button:active { transform: scale(.93); }

    .play-button {
      width: 60px;
      height: 60px;
      border: 0;
      background: linear-gradient(145deg, var(--rose-light), var(--rose));
      color: #2b151d;
      box-shadow: 0 12px 32px rgba(239,170,168,.26), inset 0 1px rgba(255,255,255,.42);
    }

    .play-button:hover { background: linear-gradient(145deg, #ffe1df, #f1b2b0); }

    .play-button:active { transform: scale(.94); }

    .play-icon, .pause-icon, .skip-icon, .volume-icon { width: 18px; height: 18px; display: block; }

    .volume-area {
      display: flex;
      justify-self: end;
      align-items: center;
      gap: 8px;
      min-width: 134px;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-soft);
      border-radius: 10px;
      cursor: pointer;
    }

    .volume-control {
      position: relative;
      width: 98px;
      height: 26px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
    }

    .volume-track {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      overflow: visible;
    }

    .volume-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 70%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--rose), var(--amber));
    }

    .volume-knob {
      position: absolute;
      top: 50%;
      left: 70%;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff8f6;
      box-shadow: 0 2px 12px rgba(239,170,168,.34);
      transform: translate(-50%, -50%) scale(.9);
      transition: transform .16s ease;
    }

    .volume-control:hover .volume-knob,
    .volume-control.dragging .volume-knob { transform: translate(-50%, -50%) scale(1.08); }

    .lyrics-card {
      border-radius: 34px;
      padding: 28px;
      min-height: 680px;
    }

    .lyrics-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .lyrics-label {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .09em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .lyrics-note {
      margin: 0;
      color: rgba(215,204,213,.60);
      font-size: 12px;
    }

    .lyrics-viewport {
      position: relative;
      height: 575px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.16) transparent;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 11%, #000 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 11%, #000 88%, transparent 100%);
    }

    .lyrics-viewport::-webkit-scrollbar { width: 5px; }
    .lyrics-viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 999px; }

    .lyrics-inner {
      padding: 210px 22px 240px 4px;
    }

    .lyric-line {
      position: relative;
      width: 100%;
      display: block;
      padding: 11px 0;
      margin: 0;
      border: 0;
      text-align: left;
      background: transparent;
      color: rgba(245,240,244,.34);
      font-size: clamp(20px, 2.4vw, 31px);
      font-weight: 540;
      line-height: 1.16;
      letter-spacing: -.026em;
      cursor: pointer;
      filter: blur(.65px);
      transform: translateX(0) scale(.985);
      transition: color .5s var(--ease), opacity .5s var(--ease), transform .65s var(--ease), filter .5s var(--ease);
      opacity: .55;
    }

    .lyric-line:hover { color: rgba(245,240,244,.68); }

    .lyric-line.active {
      color: var(--rose-light);
      opacity: 1;
      filter: blur(0);
      transform: translateX(7px) scale(1.035);
      text-shadow: 0 0 28px rgba(239,170,168,.25);
    }

    .lyric-line.previous { opacity: .68; }

    .lyric-line.active::before {
      content: "";
      position: absolute;
      left: -16px;
      top: 16px;
      width: 3px;
      height: calc(100% - 32px);
      border-radius: 999px;
      background: linear-gradient(180deg, var(--rose), var(--amber));
      box-shadow: 0 0 18px rgba(239,170,168,.36);
    }

    .bottom-note {
      margin: 18px 3px 0;
      color: rgba(215,204,213,.45);
      font-size: 12px;
      line-height: 1.5;
    }

    .hint {
      display: flex;
      gap: 7px;
      align-items: center;
      margin-top: 16px;
      color: rgba(215,204,213,.42);
      font-size: 11px;
    }

    kbd {
      border: 1px solid rgba(255,255,255,.10);
      border-bottom-color: rgba(255,255,255,.15);
      padding: 1px 5px;
      border-radius: 5px;
      background: rgba(255,255,255,.035);
      font-size: 10px;
    }

    .footer {
      padding: 38px 4px 8px;
      color: rgba(215,204,213,.42);
      font-size: 12px;
      text-align: center;
    }

    .footer-heart { color: var(--rose); }

    .message {
      min-height: 18px;
      margin-top: 10px;
      color: var(--rose-light);
      font-size: 12px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .25s ease, transform .25s ease;
    }

    .message.show { opacity: 1; transform: translateY(0); }

    .hidden { display: none !important; }

    @media (max-width: 920px) {
      .page { width: min(100% - 28px, 740px); }
      .content-grid { grid-template-columns: 1fr; }
      .player-card { position: relative; top: auto; }
      .lyrics-card { min-height: auto; }
      .lyrics-viewport { height: 520px; }
      .lyrics-inner { padding-top: 185px; padding-bottom: 200px; }
    }

    @media (max-width: 560px) {
      .page { width: min(100% - 20px, 100%); }
      .topbar { margin-bottom: 20px; }
      .topbar-right span { display: none; }
      .hero { padding: 2px 7px 0; }
      h1 { font-size: clamp(43px, 15vw, 66px); }
      .hero-subtitle { font-size: 15px; margin-top: 17px; }
      .content-grid { margin-top: 28px; gap: 14px; }
      .player-card, .lyrics-card { border-radius: 27px; }
      .player-card { padding: 14px; }
      .cover { border-radius: 21px; }
      .song-meta { padding-top: 18px; }
      .song-title { font-size: 22px; }
      .control-row { grid-template-columns: 1fr auto 1fr; gap: 6px; }
      .skip-group { gap: 4px; }
      .control-button { width: 39px; height: 39px; }
      .play-button { width: 58px; height: 58px; }
      .volume-area { min-width: 104px; }
      .volume-control { width: 72px; }
      .lyrics-card { padding: 20px 18px 18px; }
      .lyrics-viewport { height: 485px; }
      .lyrics-inner { padding-top: 165px; padding-bottom: 180px; }
      .lyric-line { font-size: 21px; padding: 10px 0; }
      .lyrics-note { display: none; }
      .hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
      .lyrics-viewport {
        mask-image: none;
        -webkit-mask-image: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="noise" aria-hidden="true"></div>

  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">♡</span>
        <span>Septemberlicht</span>
      </div>
      <div class="topbar-right">
        <span>2 Jahre</span>
        <span class="status-dot" aria-hidden="true"></span>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Für immer wir</p>
        <h1 id="page-title">Spätes Septemberlicht</h1>
        <p class="hero-subtitle">Ein Lieb über UNS</p>
      </section>

      <section class="content-grid" aria-label="Musik und Lyrics">
        <article class="surface player-card" id="player-card">
          <div class="cover" aria-hidden="true">
            <div class="cover-halo"></div>
            <div class="cover-disc"></div>
          </div>

          <div class="song-meta">
            <h2 class="song-title">Septemberlicht</h2>
            <p class="song-subtitle">schon 2 Jahre. Für immer wir.</p>
          </div>

          <audio id="audio" preload="metadata">
            <source src="song.mp3" type="audio/mpeg">
          </audio>

          <div class="player-controls">
            <div class="progress-wrap">
              <div class="progress-track" id="progressTrack" role="slider" tabindex="0" aria-label="Wiedergabeposition" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-thumb" id="progressThumb"></div>
              </div>
              <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
              </div>
            </div>

            <div class="control-row">
              <div class="skip-group">
                <button class="control-button" id="back10" type="button" aria-label="10 Sekunden zurück">
                  <svg class="skip-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M8 6.5V4L3.5 7.8 8 11.6V9.1C10.6 9.1 12.7 11.2 12.7 13.8C12.7 16.4 10.6 18.5 8 18.5C5.5 18.5 3.6 16.8 3.3 14.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M15 9.1H19.2V18H15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M19.2 9.1L15 13.55H19.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <text x="7.1" y="16.6" font-size="5" fill="currentColor">10</text>
                  </svg>
                </button>
                <button class="control-button" id="forward10" type="button" aria-label="10 Sekunden vor">
                  <svg class="skip-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M16 6.5V4L20.5 7.8 16 11.6V9.1C13.4 9.1 11.3 11.2 11.3 13.8C11.3 16.4 13.4 18.5 16 18.5C18.5 18.5 20.4 16.8 20.7 14.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 9.1H4.8V18H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4.8 9.1L9 13.55H4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <text x="12" y="16.6" font-size="5" fill="currentColor">10</text>
                  </svg>
                </button>
              </div>

              <button class="control-button play-button" id="playButton" type="button" aria-label="Musik abspielen" aria-pressed="false">
                <svg class="play-icon" id="playIcon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 6.1v11.8c0 .8.9 1.3 1.6.9l8.3-5.9c.7-.5.7-1.4 0-1.8l-8.3-5.9C9.9 5 9 5.3 9 6.1Z"/></svg>
                <svg class="pause-icon hidden" id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8.1 6.3c0-.6.5-1.1 1.1-1.1h1.1c.6 0 1.1.5 1.1 1.1v11.4c0 .6-.5 1.1-1.1 1.1H9.2c-.6 0-1.1-.5-1.1-1.1V6.3Zm5.4 0c0-.6.5-1.1 1.1-1.1h1.1c.6 0 1.1.5 1.1 1.1v11.4c0 .6-.5 1.1-1.1 1.1h-1.1c-.6 0-1.1-.5-1.1-1.1V6.3Z"/></svg>
              </button>

              <div class="volume-area">
                <button class="icon-button" id="muteButton" type="button" aria-label="Stumm schalten" aria-pressed="false">
                  <svg class="volume-icon" id="volumeHighIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.6 10.1v3.8c0 .6.4 1 1 1h2.1l3.3 2.8c.7.6 1.6.1 1.6-.8V7.1c0-.9-1-1.4-1.6-.8L7.7 9.1H5.6c-.6 0-1 .4-1 1Z" fill="currentColor"/><path d="M15 9.2c1 .8 1.6 2 1.6 3.8s-.6 3-1.6 3.8M17.6 6.8c1.9 1.6 3 3.7 3 6.2s-1.1 4.6-3 6.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                  <svg class="volume-icon hidden" id="volumeMuteIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.6 10.1v3.8c0 .6.4 1 1 1h2.1l3.3 2.8c.7.6 1.6.1 1.6-.8V7.1c0-.9-1-1.4-1.6-.8L7.7 9.1H5.6c-.6 0-1 .4-1 1Z" fill="currentColor"/><path d="m16.2 9.7 4 4m0-4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                </button>
                <div class="volume-control" id="volumeControl" role="slider" tabindex="0" aria-label="Lautstärke" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70">
                  <div class="volume-track">
                    <div class="volume-fill" id="volumeFill"></div>
                    <div class="volume-knob" id="volumeKnob"></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="message" id="audioMessage" aria-live="polite"></div>
            <div class="hint"><kbd>Leertaste</kbd> Play/Pause&nbsp; · &nbsp;<kbd>←</kbd><kbd>→</kbd> 10 Sekunden</div>
          </div>
        </article>

        <article class="surface lyrics-card">
          <div class="lyrics-head">
            <h2 class="lyrics-label">Lyrics</h2>
            <p class="lyrics-note"></p>
          </div>

          <div class="lyrics-viewport" id="lyricsViewport" aria-label="Songtext">
            <div class="lyrics-inner" id="lyricsInner"></div>
          </div>

          <p class="bottom-note"></p>
        </article>
      </section>
    </main>

    <footer class="footer">Mit Liebe gestaltet <span class="footer-heart">♡</span> für zwei Jahre.</footer>
  </div>

  <script>
    const LYRICS = [
      { time: 5, text: "Zusammen auf dem Dach, spätes Septemberlicht" },
      { time: 11, text: "Zwei Jahre an deiner Seite, mehr brauche ich nicht" },
      { time: 17, text: "Der Wind weht leise, du schaust mich an" },
      { time: 23, text: "Und ich denke zurück, wie alles begann:" },
      { time: 29, text: "'Cause we fell in love in September" },
      { time: 34, text: "On the twenty-first day" },
      { time: 38, text: "Looking up at the stars" },
      { time: 42, text: "Just the way that I like it" },
      { time: 47, text: "моя любимая, mein ganzes Glück" },
      { time: 53, text: "Ich schau nur nach vorn, nie wieder zurück" },
      { time: 59, text: "Du bist meine Welt, mein Lieblingsort" },
      { time: 65, text: "Mit dir bin ich Zuhause, genau hier und sofort" },
      { time: 72, text: "Warmes Licht am Abend, der Herbst fängt an" },
      { time: 79, text: "Bin so stolz, dass ich dich meine Freundin nennen kann" },
      { time: 87, text: "Zwei Jahre vergangen, fühlt sich immer noch neu an" },
      { time: 95, text: "Der beste Weg, den man zusammen gehen kann" },
      { time: 103, text: "'Cause we fell in love in September" },
      { time: 108, text: "On the twenty-first day" },
      { time: 112, text: "Looking up at the stars" },
      { time: 116, text: "Just the way that I like it" },
      { time: 121, text: "моя любимая, mein ganzes Glück" },
      { time: 127, text: "Ich schau nur nach vorn, nie wieder zurück" },
      { time: 133, text: "Du bist meine Welt, mein Lieblingsort" },
      { time: 139, text: "Mit dir bin ich Zuhause, genau hier und sofort" },
      { time: 147, text: "со́лнышко, du bist mein Licht" },
      { time: 154, text: "2 Jahre mit dir, ein Ende gibt es nicht" }
    ];

    const audio = document.getElementById('audio');
    const playerCard = document.getElementById('player-card');
    const playButton = document.getElementById('playButton');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const back10 = document.getElementById('back10');
    const forward10 = document.getElementById('forward10');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const progressThumb = document.getElementById('progressThumb');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const muteButton = document.getElementById('muteButton');
    const volumeControl = document.getElementById('volumeControl');
    const volumeFill = document.getElementById('volumeFill');
    const volumeKnob = document.getElementById('volumeKnob');
    const volumeHighIcon = document.getElementById('volumeHighIcon');
    const volumeMuteIcon = document.getElementById('volumeMuteIcon');
    const messageEl = document.getElementById('audioMessage');
    const lyricsViewport = document.getElementById('lyricsViewport');
    const lyricsInner = document.getElementById('lyricsInner');

    let activeLyricIndex = -1;
    let lastNonZeroVolume = 0.7;
    let isSeekingProgress = false;
    let isSeekingVolume = false;

    const formatTime = (seconds) => {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    };

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.classList.toggle('show', Boolean(text));
    }

    function renderLyrics() {
      const fragment = document.createDocumentFragment();
      LYRICS.forEach((line, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'lyric-line';
        button.dataset.index = String(index);
        button.dataset.time = String(line.time);
        button.textContent = line.text;
        button.setAttribute('aria-label', `Songtext ab ${formatTime(line.time)}: ${line.text}`);
        button.addEventListener('click', () => {
          if (!Number.isFinite(audio.duration)) return;
          audio.currentTime = Math.min(line.time, audio.duration);
          if (audio.paused) {
            audio.play().catch(() => {});
          }
        });
        fragment.appendChild(button);
      });
      lyricsInner.appendChild(fragment);
    }

    renderLyrics();
    const lyricButtons = Array.from(document.querySelectorAll('.lyric-line'));

    function setPlayingUI(playing) {
      playerCard.classList.toggle('is-playing', playing);
      playIcon.classList.toggle('hidden', playing);
      pauseIcon.classList.toggle('hidden', !playing);
      playButton.setAttribute('aria-label', playing ? 'Musik pausieren' : 'Musik abspielen');
      playButton.setAttribute('aria-pressed', String(playing));
    }

    async function togglePlay() {
      if (audio.paused) {
        try {
          await audio.play();
          showMessage('');
        } catch (error) {
          showMessage('Die Musik konnte nicht gestartet werden. Prüfe, ob song.mp3 neben index.html liegt.');
        }
      } else {
        audio.pause();
      }
    }

    playButton.addEventListener('click', togglePlay);

    back10.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    forward10.addEventListener('click', () => {
      audio.currentTime = Math.min(Number.isFinite(audio.duration) ? audio.duration : audio.currentTime + 10, audio.currentTime + 10);
    });

    function updateProgressUI() {
      const duration = audio.duration;
      const percent = Number.isFinite(duration) && duration > 0 ? (audio.currentTime / duration) * 100 : 0;
      progressFill.style.width = `${Math.max(0, Math.min(100, percent))}%`;
      progressThumb.style.left = `${Math.max(0, Math.min(100, percent))}%`;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      progressTrack.setAttribute('aria-valuenow', String(Math.round(percent)));
    }

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
      updateProgressUI();
      showMessage('');
    });

    audio.addEventListener('timeupdate', () => {
      if (!isSeekingProgress) updateProgressUI();
      updateLyrics(audio.currentTime);
    });

    audio.addEventListener('play', () => setPlayingUI(true));
    audio.addEventListener('pause', () => setPlayingUI(false));

    audio.addEventListener('ended', () => {
      setPlayingUI(false);
      audio.currentTime = 0;
      updateProgressUI();
      updateLyrics(0);
    });

    audio.addEventListener('error', () => {
      showMessage('song.mp3 wurde nicht gefunden. Lege die MP3-Datei in denselben Ordner wie diese index.html.');
    });

    function progressFromPointer(clientX) {
      const rect = progressTrack.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime = ratio * audio.duration;
      }
      updateProgressUI();
    }

    progressTrack.addEventListener('pointerdown', (event) => {
      if (!Number.isFinite(audio.duration)) return;
      isSeekingProgress = true;
      progressTrack.classList.add('dragging');
      progressTrack.setPointerCapture(event.pointerId);
      progressFromPointer(event.clientX);
    });

    progressTrack.addEventListener('pointermove', (event) => {
      if (isSeekingProgress) progressFromPointer(event.clientX);
    });

    function stopProgressSeek(event) {
      if (!isSeekingProgress) return;
      isSeekingProgress = false;
      progressTrack.classList.remove('dragging');
      try { progressTrack.releasePointerCapture(event.pointerId); } catch (_) {}
    }

    progressTrack.addEventListener('pointerup', stopProgressSeek);
    progressTrack.addEventListener('pointercancel', stopProgressSeek);

    progressTrack.addEventListener('keydown', (event) => {
      if (!Number.isFinite(audio.duration)) return;
      let next = audio.currentTime;
      if (event.key === 'ArrowLeft') next -= 5;
      else if (event.key === 'ArrowRight') next += 5;
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = audio.duration;
      else return;
      event.preventDefault();
      audio.currentTime = Math.max(0, Math.min(audio.duration, next));
    });

    function setVolume(value) {
      const volume = Math.max(0, Math.min(1, value));
      audio.volume = volume;
      if (volume > 0) {
        audio.muted = false;
        lastNonZeroVolume = volume;
      } else {
        audio.muted = true;
      }
      updateVolumeUI();
      try { localStorage.setItem('septemberlicht-volume', String(volume)); } catch (_) {}
    }

    function updateVolumeUI() {
      const volume = audio.muted ? 0 : audio.volume;
      const percent = Math.round(volume * 100);
      volumeFill.style.width = `${percent}%`;
      volumeKnob.style.left = `${percent}%`;
      volumeControl.setAttribute('aria-valuenow', String(percent));
      const muted = audio.muted || volume <= 0;
      muteButton.setAttribute('aria-pressed', String(muted));
      muteButton.setAttribute('aria-label', muted ? 'Stummschaltung aufheben' : 'Stumm schalten');
      volumeHighIcon.classList.toggle('hidden', muted);
      volumeMuteIcon.classList.toggle('hidden', !muted);
    }

    function volumeFromPointer(clientX) {
      const rect = volumeControl.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      setVolume(ratio);
    }

    volumeControl.addEventListener('pointerdown', (event) => {
      isSeekingVolume = true;
      volumeControl.classList.add('dragging');
      volumeControl.setPointerCapture(event.pointerId);
      volumeFromPointer(event.clientX);
    });

    volumeControl.addEventListener('pointermove', (event) => {
      if (isSeekingVolume) volumeFromPointer(event.clientX);
    });

    function stopVolumeSeek(event) {
      if (!isSeekingVolume) return;
      isSeekingVolume = false;
      volumeControl.classList.remove('dragging');
      try { volumeControl.releasePointerCapture(event.pointerId); } catch (_) {}
    }

    volumeControl.addEventListener('pointerup', stopVolumeSeek);
    volumeControl.addEventListener('pointercancel', stopVolumeSeek);

    volumeControl.addEventListener('keydown', (event) => {
      const step = 0.05;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') {
        setVolume(audio.muted ? 0 : audio.volume - step);
        event.preventDefault();
      } else if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {
        setVolume(audio.muted ? Math.max(step, lastNonZeroVolume) : audio.volume + step);
        event.preventDefault();
      } else if (event.key === 'Home') {
        setVolume(0);
        event.preventDefault();
      } else if (event.key === 'End') {
        setVolume(1);
        event.preventDefault();
      }
    });

    muteButton.addEventListener('click', () => {
      if (audio.muted || audio.volume === 0) {
        const restore = lastNonZeroVolume > 0 ? lastNonZeroVolume : 0.7;
        audio.muted = false;
        setVolume(restore);
      } else {
        lastNonZeroVolume = audio.volume;
        audio.muted = true;
        updateVolumeUI();
      }
    });

    try {
      const saved = parseFloat(localStorage.getItem('septemberlicht-volume'));
      if (Number.isFinite(saved)) lastNonZeroVolume = Math.max(.01, Math.min(1, saved));
    } catch (_) {}
    setVolume(lastNonZeroVolume);

    function updateLyrics(time) {
      let index = -1;
      for (let i = 0; i < LYRICS.length; i++) {
        if (time >= LYRICS[i].time) index = i;
        else break;
      }

      if (index === activeLyricIndex) return;
      activeLyricIndex = index;

      lyricButtons.forEach((button, i) => {
        button.classList.toggle('active', i === index);
        button.classList.toggle('previous', index >= 0 && i < index);
      });

      if (index >= 0 && lyricButtons[index]) {
        lyricButtons[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        lyricsViewport.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    document.addEventListener('keydown', (event) => {
      const target = event.target;
      const typing = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target.isContentEditable;
      if (typing) return;

      if (event.code === 'Space') {
        event.preventDefault();
        togglePlay();
      } else if (event.key === 'ArrowLeft') {
        audio.currentTime = Math.max(0, audio.currentTime - 10);
      } else if (event.key === 'ArrowRight') {
        audio.currentTime = Math.min(Number.isFinite(audio.duration) ? audio.duration : audio.currentTime + 10, audio.currentTime + 10);
      }
    });

    // Subtle animated background — kept intentionally calm so the lyrics stay primary.
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let particles = [];
    let hearts = [];
    let petals = [];
    let lastFrame = performance.now();

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const count = Math.min(100, Math.max(48, Math.floor(width / 13)));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.4 + .3,
        a: Math.random() * .45 + .08,
        tw: Math.random() * Math.PI * 2,
        speed: Math.random() * .32 + .08
      }));
    }

    function spawnHeart() {
      if (hearts.length > 10) return;
      hearts.push({
        x: Math.random() * width,
        y: height + 22,
        size: Math.random() * 8 + 9,
        life: 0,
        max: Math.random() * 4 + 5,
        drift: (Math.random() - .5) * .18,
        rise: Math.random() * .18 + .14,
        alpha: Math.random() * .28 + .18
      });
    }

    function spawnPetal() {
      if (petals.length > 20) return;
      petals.push({
        x: Math.random() * width,
        y: -20,
        size: Math.random() * 4 + 4,
        rot: Math.random() * Math.PI,
        spin: (Math.random() - .5) * .03,
        fall: Math.random() * .22 + .08,
        drift: Math.random() * .18 + .06,
        alpha: Math.random() * .14 + .07
      });
    }

    function drawHeart(x, y, size, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      ctx.moveTo(0, size * .82);
      ctx.bezierCurveTo(-size * 1.12, size * .05, -size * .54, -size * .66, 0, -size * .16);
      ctx.bezierCurveTo(size * .54, -size * .66, size * 1.12, size * .05, 0, size * .82);
      ctx.strokeStyle = `rgba(239,170,168,${alpha})`;
      ctx.lineWidth = 1.15;
      ctx.stroke();
      ctx.restore();
    }

    function animate(now) {
      const dt = Math.min(.05, (now - lastFrame) / 1000);
      lastFrame = now;
      ctx.clearRect(0, 0, width, height);

      const playing = !audio.paused;
      particles.forEach(p => {
        p.y -= p.speed * dt * 7;
        p.tw += dt * 1.3;
        if (p.y < -10) p.y = height + 10;
        const alpha = p.a * (0.65 + 0.35 * Math.sin(p.tw));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,235,228,${alpha})`;
        ctx.fill();
      });

      if (playing && Math.random() < dt * .9) spawnHeart();
      if (Math.random() < dt * .45) spawnPetal();

      hearts = hearts.filter(h => {
        h.life += dt;
        h.y -= h.rise * dt * 45;
        h.x += h.drift * dt * 35;
        drawHeart(h.x, h.y, h.size, h.alpha * Math.max(0, 1 - h.life / h.max));
        return h.life < h.max;
      });

      petals = petals.filter(p => {
        p.y += p.fall * dt * 42;
        p.x += Math.sin(p.y * .014) * p.drift;
        p.rot += p.spin;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * .62, 0, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,210,205,${p.alpha})`;
        ctx.fill();
        ctx.restore();
        return p.y < height + 30;
      });

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resizeCanvas, { passive: true });
    resizeCanvas();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
